{% load static %}

<!DOCTYPE html>

<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
      {% block title %}
        Team AllCycles Meaux
      {% endblock %}
    </title>

    <script>
      const theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-bs-theme", theme)
    </script>

    <script src="https://kit.fontawesome.com/3385d72d25.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="{% static 'css/site.css' %}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet" />

    <head>
      <meta charset="UTF-8" />
      <title>Team AllCycles Meaux</title>

      <!-- ICI : Le CSS et JS du widget d'actualités -->
      <script type="text/javascript" src="https://assets.juicer.io/embed.js"></script>
      <link href="https://assets.juicer.io/embed.css" media="all" rel="stylesheet" type="text/css" />
    </head>
    {% block extra_head %}

    {% endblock %}
  </head>

  <body>
    {% block body_content %}

    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    {% block extra_js %}

    {% endblock %}
  </body>
</html>
