{% load static %}

<header class="sticky-top border-bottom">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container py-1 py-lg-2">
      <a class="navbar-brand" href="{% url 'home' %}">
        <!-- Logo affiché en mode CLAIR -->
        <img class="logo-light" src="{% static 'img/logos/tam77-light.png' %}" alt="TAM77 — Team AllCycles Meaux" />

        <!-- Logo affiché en mode SOMBRE (à adapter si ton fichier s'appelle autrement) -->
        <img class="logo-dark" src="{% static 'img/logos/tam77-dark.png' %}" alt="TAM77 — Team AllCycles Meaux" />
      </a>
      <button class="navbar-toggler border-0 bg-body-secondary rounded-circle p-2 shadow-sm" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation"><i class="fa-solid fa-bars fs-5 text-dark"></i></button>

      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <!-- 1. Liens de navigation principaux -->
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-1 mt-2">
          <a class="nav-link fs-5 {% if request.resolver_match.url_name == 'dn3' %}active{% endif %}" href="{% url 'dn3' %}">DN3</a>
          <a class="nav-link fs-5 {% if request.resolver_match.url_name == 'young' %}active{% endif %}" href="{% url 'young' %}">JEUNES</a>
          <a class="nav-link fs-5 {% if request.resolver_match.url_name == 'club' %}active{% endif %}" href="{% url 'club' %}">CLUB</a>
          <a class="nav-link fs-5 {% if request.resolver_match.url_name == 'partner' %}active{% endif %}" href="{% url 'partner' %}">PARTENAIRES</a>
          <a class="nav-link fs-5 {% if request.resolver_match.url_name == 'events' %}active{% endif %}" href="{% url 'events' %}">ORGANISATIONS</a>
        </div>

        <!-- 2. Bloc Réseaux Sociaux (Séparé du navbar-nav) -->
        <div class="nav-socials d-flex align-items-center gap-2 ms-lg-5 mt-3 mt-lg-0 pt-3 pt-lg-0">
            <a href="https://www.facebook.com/team.allcycles.meaux" class="social-link" href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f fs-5"></i></a>
            <a href="https://www.instagram.com/teamallcyclesmeaux/" class="social-link" href="#" aria-label="Instagram"><i class="fa-brands fa-instagram fs-5"></i></a>
            <a class="social-link ms-4 text-decoration-none" href="{% url 'shop' %}" aria-label="Boutique club"><i class="fa-solid fa-shirt"></i><span class="d-inline small ms-2">Boutique</span></a>
        </div>
      </div>
    </div>
  </nav>
</header>
