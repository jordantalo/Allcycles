{% extends 'core/components/root.html' %}

{% block body_content %}
  <div class="bg-body-secondary py-5 d-flex min-vh-100 flex-grow-1 justify-content-center align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow border-0">
            <div class="card-body p-4">
              <h3 class="card-title text-center mb-4">Portail club</h3>

              {% if form.errors %}
                <div class="alert alert-danger small">Identifiant ou mot de passe incorrect.</div>
              {% endif %}

              <form method="post" class="mb-2">
                {% csrf_token %}
                <div class="mb-3">
                  <label for="id_username" class="form-label">Login</label>
                  <input type="text" name="username" class="form-control" id="id_username" required />
                </div>
                <div class="mb-3">
                  <label for="id_password" class="form-label">Mot de passe</label>
                  <input type="password" name="password" class="form-control" id="id_password" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
              </form>

              <div>
                <!-- Utilisation du nom d'URL par défaut de Django -->
                <a href="{% url 'password_reset' %}" class="small text-decoration-none">Mot de passe oublié ?</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
