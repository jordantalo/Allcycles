<div class="card shadow-sm p-3 flex-grow-1">
  <div class="d-flex justify-content-between align-items-start">
    <div class="flex-grow-1">
      <h2 class="h5">Mes informations personnelles</h2>
      <form id="form-info" method="POST">
        {% csrf_token %}
        <div class="mb-2">
          <label for="user-email" class="form-label small mb-0">Adresse email</label>
          <input type="email" class="form-control-plaintext form-control-sm small text-muted" id="user-email" name="user_email" value="{{ request.user.email }}" aria-describedby="emailHelp" readonly required style="max-width: 300px" />
        </div>
        <div>
          <label for="user-phone" class="form-label small mb-0">Numero de téléphone</label>
          <input type="tel" class="form-control-plaintext form-control-sm small text-muted" id="user-phone" name="user_phone" value="{{ request.user.profile.phone }}" aria-describedby="emailHelp" style="max-width: 300px" readonly required />
        </div>
      </form>
    </div>
    <div class="d-flex flex-column align-items-start gap-2">
      <button type="button" id="valid-profil-info" class="d-none btn btn-sm btn-success py-0 px-1 m-0 rounded-circle"><i class="bi bi-check"></i></button>
      <button type="button" id="cancel-profil-info" class="d-none btn btn-sm btn-danger py-0 px-1 m-0 rounded-circle fw-bold"><i class="bi bi-x"></i></button>
      <button type="button" id="edit-profil-info" class="btn btn-sm p-0"><i class="bi bi-pencil-square"></i></button>
    </div>
  </div>
</div>

{% block extra_js %}
<script>
  document.getElementById('edit-profil-info').addEventListener('click', function () {
      display_check_btns('cancel-profil-info', 'edit-profil-info', 'valid-profil-info')

      const inputs = document.querySelectorAll('#form-info input')
      inputs.forEach((input) => {
        input.removeAttribute('readonly')
        input.classList.remove('form-control-plaintext')
        input.classList.add('form-control')
      })
    })

    document.getElementById('cancel-profil-info').addEventListener('click', function () {
      display_edit_btn('cancel-profil-info', 'edit-profil-info', 'valid-profil-info')

      const inputs = document.querySelectorAll('#form-info input')
      inputs.forEach((input) => {
        input.readOnly = true
        input.classList.add('form-control-plaintext')
        input.classList.remove('form-control')
      })
    })

    document.getElementById('valid-profil-info').addEventListener('click', function () {
      document.getElementById('form-info').requestSubmit()
    })
</script>
{% endblock extra_js %}
