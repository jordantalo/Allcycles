<form method="POST" class="bg-body shadow-lg p-4 p-md-5 rounded-4">
	{% csrf_token %}
  {% for rider, presence in race.rider_presences %}
  <label for="finisher_status_{{ rider.id }}" class="form-label">{{ rider.user.first_name }} {{ rider.user.last_name }}</label>
	<div class="mb-2">
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="finisher_status_{{ rider.id }}" id="finisher_{{ rider.id }}" value="finisher" 
      {% if not presence.finisher_status %}checked {% elif presence.finisher_status == "finisher" %}checked{% endif %}>
      <label class="form-check-label" for="finisher_{{ rider.id }}">
      Finisher
      </label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="finisher_status_{{ rider.id }}" id="DNS_{{ rider.id }}" value="DNS"
      {% if presence.finisher_status == "DNS" %}checked{% endif %}>
      <label class="form-check-label" for="DNS_{{ rider.id }}">
      DNS
      </label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="finisher_status_{{ rider.id }}" id="DNF_{{ rider.id }}" value="DNF"
      {% if presence.finisher_status == "DNF" %}checked{% endif %}>
      <label class="form-check-label" for="DNF_{{ rider.id }}">
      DNF
      </label>
    </div>
  </div>
  <div>
    <div class="input-group mb-3">
      <span class="input-group-text bg-body-secondary" id="basic-addon3">Position</span>
      <input type="number" class="form-control" id="position_{{ rider.id }}" name="position_{{ rider.id }}" min="1" max="200" aria-describedby="basic-addon3 basic-addon4"
      {% if presence %}value="{{ presence.position }}"{% endif %}>
    </div>
    
  </div>
  {% endfor %}
  <button type="submit" class="mt-2 btn btn-outline-secondary w-100 py-2 text-uppercase fw-bold shadow-sm" style="letter-spacing: 0.05em;">Sauvegarder</button>
</form>
