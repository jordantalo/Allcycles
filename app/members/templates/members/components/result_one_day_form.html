<form method="POST" class="bg-body shadow-lg p-4 p-md-5 rounded-4">
  {% csrf_token %}
  {% for stage, rider_results in results %}
    {% for rider, result in rider_results %}
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0">{{ rider.user.first_name }} {{ rider.user.last_name|capfirst }}</h5>
      </div>

      <div class="card-body">
        <div class="row g-4">

          <div class="col-12">
              {% include 'members/components/result_position.html' with stage=stage rider=rider result=result %}
          </div>

        </div>
      </div>
    </div>
    {% endfor %}
  {% endfor %}
  <button type="submit" class="btn btn-outline-secondary w-100 py-2 text-uppercase fw-bold shadow-sm" style="letter-spacing: 0.05em;">Sauvegarder</button>
</form>
