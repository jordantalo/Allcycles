<form method="post" class="bg-body shadow-lg p-4 p-md-5 rounded-4">
	{% csrf_token %}
	<div class="mb-3">
		<label for="race_name" class="form-label fw-semibold">Nom de la course</label>
		<div class="input-group">
			<span class="input-group-text bg-body-secondary" id="basic-addon3"><i class="bi bi-bicycle"></i></span>
			<input type="text" class="form-control" id="race_name" name="title" value="{{ race.title|default:'' }}"
				aria-describedby="basic-addon3 basic-addon4" required />
		</div>
	</div>

	<div class="mb-3">
		<label for="race_level" class="form-label fw-semibold">Catégorie</label>
		<select class="form-select" id="race_level" name="category_type" aria-label="Default select example">
			<option
				{% if race and race.category_type == "elite_regionale" %}selected{% elif not race %}selected{% endif %}
				value="elite_regionale">Elite régionale</option>
			<option {% if race and race.category_type == "elite_nationale" %}selected{% endif %}
				value="elite_nationale">Elite nationale</option>
			<option {% if race and race.category_type == "open1" %}selected{% endif %} value="open1">Open 1</option>
		</select>
	</div>

	<div class="mb-3">
		<label for="date" class="form-label">Date</label>
		<div class="input-group">
			<span class="input-group-text bg-body-secondary"><i class="bi bi-calendar-event"></i></span>
			<input type="date" name="date" id="date" class="form-control"
				value="{{ race.date|date:'Y-m-d'|default:'' }}" required />
		</div>
	</div>

	<div class="mb-3">
		<div class="form-check form-switch">
			<input class="form-check-input" type="checkbox" name="dn_race" role="switch" id="id_dn_race"
				{% if race and race.is_dn_race %}checked {% elif not race %}checked{% endif %} />
			<label class="form-check-label" for="id_dn_race">Course DN</label>
		</div>
	</div>

	<div class="mb-3">
		<label class="form-label fw-bold">Sélection des coureurs</label>

		<div class="p-3 border rounded bg-body-tertiary">
			{% for rider in riders %}
			<div class="form-check">
				<input class="form-check-input rider-checkbox" type="checkbox" name="riders" value="{{ rider.id }}"
					id="rider_{{ rider.id }}"
					{% if race and rider in race.riders.all %}checked{% elif not race%}checked{% endif %} />
				<label class="form-check-label d-flex justify-content-between" for="rider_{{ rider.id }}">
					<div>{{ rider.user.first_name }} {{ rider.user.last_name }}</div>
					<div>
						<span class="badge bg-primary-subtle text-primary">{{ rider.get_category_ffc_display }}</span>
						<span class="badge bg-danger-subtle text-danger">
							{% if rider.belong_to_dn %}
							DN
							{% else %}
							Hors DN
							{% endif %}
						</span>
					</div>
				</label>
			</div>
			{% empty %}
			<p class="text-muted mb-0">Aucun coureur enregistré pour le moment.</p>
			{% endfor %}
		</div>
  </div>
  <div class="mb-3">
    <label class="form-label fw-bold">Sélection du staff</label>
    
    <div class="p-3 border rounded bg-body-tertiary">  
			{% for staff_member in staff %}
			<div class="form-check">
				<input class="form-check-input rider-checkbox" type="checkbox" name="staff" value="{{ staff_member.id }}"
					id="staff_{{ staff_member.id }}"
					{% if race and staff_member in race.staff_members.all %}checked{% endif %} />
				<label class="form-check-label d-flex justify-content-between" for="staff_{{ staff_member.id }}">
					<div>{{ staff_member.user.first_name }} {{ staff_member.user.last_name }}</div>
				</label>
			</div>
			{% empty %}
			<p class="text-muted mb-0">Aucun staff enregistré pour le moment.</p>
			{% endfor %}
		</div>
	</div>

	<button type="submit" class="btn btn-light w-100 py-2 text-uppercase fw-bold shadow-sm"
		style="letter-spacing: 0.05em;">{% if race %}Modifier la course{% else %}Creer la course{% endif %}</button>
</form>
