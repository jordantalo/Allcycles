<form method="post" class="bg-body shadow p-4 p-md-5 rounded-4 row g-3">
	{% csrf_token %}
	<div class="col-12">
		<label for="race_name" class="form-label fw-semibold">Nom de la course</label>
		<div class="input-group">
			<span class="input-group-text bg-body-secondary" id="basic-addon3"><i class="bi bi-bicycle"></i></span>
			<input type="text" class="form-control" id="race_name" name="title" value="{{ race.title|default:'' }}"
				aria-describedby="basic-addon3 basic-addon4" required />
		</div>
	</div>

  <div class="col-12" id="race-type-div">
		<label for="race-type" class="form-label fw-semibold">Type de course</label>
		<select class="form-select" id="race-type" name="type" aria-label="Default select example">
			<option
				{% if race and race.type == "one_day" %}selected{% elif not race %}selected{% endif %}
				value="one_day">Course d'un jour</option>
			<option {% if race and race.type == "stage" %}selected{% endif %}
				value="stage">Course par étape</option>
			<option {% if race and race.type == "challenge" %}selected{% endif %} value="challenge">Challenge par étape</option>
		</select>
	</div>

	<div class="col-12 {% if race and race.type != "one_day" %}col-sm-6{% endif %}" id="category-div">
		<label for="race_level" class="form-label fw-semibold">Catégorie</label>
		<select class="form-select" id="race_level" name="category_type" aria-label="Default select example">
			<option
				{% if race and race.category_type == "elite_regionale" %}selected{% elif not race %}selected{% endif %}
				value="elite_regionale">Elite régionale</option>
			<option {% if race and race.category_type == "elite_nationale" %}selected{% endif %}
				value="elite_nationale">Elite nationale</option>
			<option {% if race and race.category_type == "open1" %}selected{% endif %} value="open1">Open 1</option>
		</select>
	</div>

  <div class="col-12 col-sm-6 {% if not race or race.type == "one_day" %}d-none{% endif %}" id="stage-number-div">
    <label for="race-stage-number" class="form-label fw-semibold">Nombre d'étapes</label>
      <input type="number" class="form-control" id="race-stage-number" name="num_stages" min="2" max="21" {% if race and race.type != "one_day" %}value="{{race.num_stages}}"{% endif %} aria-describedby="basic-addon3 basic-addon4">
  </div>

	<div class="{% if race and race.type != "one_day" %}col-sm-6{% endif %}" id="start-date-div">
		<label for="start-date" class="form-label fw-bold" id="start-date-race">Date {% if race.is_stage_race %}de début{% endif %}</label>
		<div class="input-group">
			<span class="input-group-text bg-body-secondary"><i class="bi bi-calendar-event"></i></span>
			<input type="date" name="date" id="start-date" class="form-control"
				value="{{ race.date|date:'Y-m-d'|default:'' }}" required />
		</div>
	</div>

  <div class="col-12 col-sm-6 {% if not race or race.type == "one_day" %}d-none{% endif %}" id="end-date-div">
		<label for="end-date" class="form-label fw-bold">Date de fin</label>
		<div class="input-group">
			<span class="input-group-text bg-body-secondary"><i class="bi bi-calendar-event"></i></span>
			<input type="date" name="end_date" id="end-date" class="form-control"
				value="{{ race.end_date|date:'Y-m-d'|default:'' }}" />
		</div>
	</div>

	<div class="col-12">
		<div class="form-check form-switch">
			<input class="form-check-input" type="checkbox" name="is_dn_race" role="switch" id="id_dn_race"
				{% if race and race.is_dn_race %}checked {% elif not race %}checked{% endif %} />
			<label class="form-check-label" for="id_dn_race">Course DN</label>
		</div>
	</div>

	<div class="col-12">
		<label class="form-label fw-bold">Sélection des coureurs</label>

		<div class="p-3 border rounded bg-body-tertiary">
			{% for rider in riders %}
			<div class="form-check">
				<input class="form-check-input rider-checkbox" type="checkbox" name="riders" value="{{ rider.id }}"
					id="rider_{{ rider.id }}"
					{% if race and rider in race.riders.all %}checked{% elif not race%}checked{% endif %} />
				<label class="form-check-label d-flex justify-content-between" for="rider_{{ rider.id }}">
					<div>{{ rider.user.first_name|capfirst }} {{ rider.user.last_name|capfirst }}</div>
					<div>
						<span class="badge bg-primary-subtle text-primary">{{ rider.get_category_ffc_display }}</span>
						<span class="badge bg-danger-subtle text-danger">
							{% if rider.belong_to_dn %}
							DN
							{% else %}
							Hors DN
							{% endif %}
						</span>
					</div>
				</label>
			</div>
			{% empty %}
			<p class="text-muted mb-0">Aucun coureur enregistré pour le moment.</p>
			{% endfor %}
		</div>
  </div>
  <div class="col-12">
    <label class="form-label fw-bold">Sélection du staff</label>

    <div class="p-3 border rounded bg-body-tertiary">
			{% for staff_member in staff %}
			<div class="form-check">
				<input class="form-check-input" type="checkbox" name="staff_members" value="{{ staff_member.id }}"
					id="staff_{{ staff_member.id }}"
					{% if race and staff_member in race.staff_members.all %}checked{% endif %} />
				<label class="form-check-label d-flex justify-content-between" for="staff_{{ staff_member.id }}">
					<div>{{ staff_member.user.first_name|capfirst }} {{ staff_member.user.last_name|capfirst }}</div>
				</label>
			</div>
			{% empty %}
			<p class="text-muted mb-0">Aucun staff enregistré pour le moment.</p>
			{% endfor %}
		</div>
	</div>

  <div class="col-12">
    <button type="submit" class="btn btn-light w-100 py-2 text-uppercase fw-bold shadow-sm"
		style="letter-spacing: 0.05em;">{% if race %}Modifier la course{% else %}Creer la course{% endif %}</button>
  </div>

</form>

{% block extra_js %}

<script>

    document.getElementById('race-type').addEventListener('change', function () {

      race_type = document.getElementById('race-type').value

      if (race_type != "one_day") {
        end_date = document.getElementById('end-date-div')
        start_date = document.getElementById('start-date-div')
        stage_num = document.getElementById('stage-number-div')
        category = document.getElementById('category-div')
        start_date.getElementsByTagName('label')[0].innerHTML = 'Date de debut'
        end_date.getElementsByTagName('input')[0].required = true
        stage_num.getElementsByTagName('input')[0].required = true
        start_date.classList.add("col-sm-6")
        stage_num.classList.remove("d-none")
        category.classList.add("col-sm-6")
        end_date.classList.remove('d-none')
      } else {
        end_date = document.getElementById('end-date-div')
        start_date = document.getElementById('start-date-div')
        stage_num = document.getElementById('stage-number-div')
        category = document.getElementById('category-div')
        start_date.getElementsByTagName('label')[0].innerHTML = 'Date'
         end_date.getElementsByTagName('input')[0].required = false
        stage_num.getElementsByTagName('input')[0].required = false
        start_date.classList.remove("col-sm-6")
        category.classList.remove("col-sm-6")
        stage_num.classList.add("d-none")
        end_date.classList.add('d-none')
      }

    })


</script>

{% endblock extra_js %}
