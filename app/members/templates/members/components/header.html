{% load static %}

{% load static %}

<header class="sticky-top border-bottom">
  <nav class="navbar navbar-expand-md bg-body-tertiary">
    <div class="container py-1 py-md-2">
      
      <!-- Logo -->
      <a class="navbar-brand" href="{% url 'members:calendar' %}">
        <img class="logo-light" src="{% static 'img/logos/tam77-light.png' %}" alt="TAM77" />
        <img class="logo-dark" src="{% static 'img/logos/tam77-dark.png' %}" alt="TAM77" />
      </a>

      <!-- Bouton Burger -->
      <button class="navbar-toggler border-0 bg-body-secondary rounded-circle p-2 shadow-sm" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars fs-5 text-dark"></i>
      </button>

      <!-- Contenu du menu -->
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        
        <!-- Liens principaux (poussés à droite sur desktop grâce à ms-auto) -->
        <ul class="navbar-nav mt-2 my-md-auto mx-auto align-items-md-center gap-md-2 mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link fs-5 {% if request.resolver_match.url_name == 'rider_dashboard' or request.resolver_match.url_name == 'staff_dashboard' %}active{% endif %}" href="{% url 'members:home_redirect' %}">Tableau de bord</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fs-5 {% if request.resolver_match.url_name == 'calendar' %}active{% endif %}" href="{% url 'members:calendar' %}">Calendrier</a>
          </li>
        </ul>

        <!-- Séparateur visuel discret sur mobile / Espace sur desktop -->
        <hr class="d-md-none text-muted my-2">

        <!-- Menu Utilisateur (Dropdown Profil & Déconnexion) -->
        <ul class="navbar-nav ms-md-2 align-items-md-center">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle fs-5 d-flex align-items-center gap-1" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fa-solid fa-circle-user"></i> 
              <span class="d-md-inline">{{ request.user.first_name }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
              <li><a class="dropdown-item" href="#"><i class="fa-solid fa-user-pen me-2"></i> Mon profil</a></li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <form action="{% url 'logout' %}" method="post">
                  {% csrf_token %}
                  <button type="submit" class="dropdown-item text-danger rounded"><i class="fa-solid fa-right-from-bracket me-2"></i> Déconnexion</button>
                </form>
              </li>
            </ul>
          </li>
        </ul>

      </div>
    </div>
  </nav>
</header>

{% comment %} <header class="sticky-top border-bottom">
