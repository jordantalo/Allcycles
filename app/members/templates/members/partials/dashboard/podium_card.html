<div class="card bg-body-tertiary rounded-3 p-3">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="d-flex align-items-center fw-bold text-body">
      <span class="badge bg-warning-subtle text-warning me-2 p-2 rounded-3 fs-6"><i class="fa-solid fa-ranking-star"></i></span>
      <span class="fw-bold text-body">Podiums de la saison</span>
    </div>
    <div class="fs-2 fw-bold text-warning">{{ stats.podium }}</div>
  </div>

  <!-- Les 3 marches du podium -->
  <div class="d-flex gap-2 align-items-end px-2" style="height: 130px;">
    <!-- 2ème Place (Argent) -->
    <div class="flex-grow-1 bg-secondary-subtle border border-secondary-subtle text-secondary-emphasis rounded-top pt-1 pb-2 text-center d-flex flex-column justify-content-between" style="height: 70%;">
      <span class="small fw-bold text-uppercase">2ème</span>
      <span class="fs-5 fw-bold">{{ stats.second|default:'0' }}</span>
    </div>

    <!-- 1ère Place (Or) -->
    <div class="flex-grow-1 bg-warning-subtle border border-warning-subtle text-warning-emphasis rounded-top pt-1 pb-2 text-center d-flex flex-column justify-content-between shadow-sm" style="height: 100%;">
      <span class="small fw-bold text-uppercase"><i class="fa-solid fa-trophy small"></i> 1er</span>
      <span class="fs-5 fw-bold">{{ stats.first|default:'0' }}</span>
    </div>

    <!-- 3ème Place (Bronze) -->
    <div class="flex-grow-1 bg-success-subtle border border-success-subtle text-success-emphasis rounded-top pt-1 pb-2 text-center d-flex flex-column justify-content-between" style="height: 50%;">
      <span class="small fw-bold text-uppercase">3ème</span>
      <span class="fs-5 fw-bold">{{ stats.third|default:'0' }}</span>
    </div>
  </div>
</div>
