<div class="card bg-body-tertiary rounded-3 p-3">
  <div class="d-flex align-items-center mb-3">
    <span class="badge bg-success-subtle text-success me-2 p-2 rounded-3 fs-6"><i class="fa-solid fa-trophy"></i></span>
    <span class="fw-bold text-body">Top performances</span>
  </div>

  <div class="d-flex gap-2 mt-3 pt-2 border-top border-secondary-subtle text-center">
    <div class="flex-fill bg-body rounded-2 p-2 border">
      <span class="d-block small text-muted">Top 5</span>
      <span class="fw-bold text-success">{{ stats.top_5|default:'0' }}</span>
    </div>
    <div class="flex-fill bg-body rounded-2 p-2 border">
      <span class="d-block small text-muted">Top 10</span>
      <span class="fw-bold text-warning">{{ stats.top_10|default:'0' }}</span>
    </div>
    <div class="flex-fill bg-body rounded-2 p-2 border">
      <span class="d-block small text-muted">Top 20</span>
      <span class="fw-bold text-danger">{{ stats.top_20|default:'0' }}</span>
    </div>
  </div>
</div>
